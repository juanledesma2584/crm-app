<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Licencias ELLE</title>

    <!-- ÍCONO PARA LA PANTALLA DE INICIO (CELULAR) -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/key.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/isometric/512/key.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 p-6 rounded-3xl max-w-sm w-full space-y-5 shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center text-lg">
                <i class="fa-solid fa-key"></i>
            </div>
            <div>
                <h2 class="text-base font-bold text-white">Panel de Licencias</h2>
                <p class="text-xs text-slate-400">ELLE Real Estate CRM</p>
            </div>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">ID de Dispositivo de la Clienta:</label>
                <input type="text" id="devId" placeholder="Ej. ELLE-7127" class="w-full p-3.5 bg-slate-950 text-amber-400 font-mono text-sm rounded-xl border border-slate-700 outline-none uppercase placeholder:text-slate-600 focus:border-amber-500 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Suscripción a Habilitar:</label>
                <select id="months" class="w-full p-3.5 bg-slate-950 text-slate-200 text-sm rounded-xl border border-slate-700 outline-none focus:border-amber-500 transition-all">
                    <option value="1">1 Mes (30 días)</option>
                    <option value="3">3 Meses (90 días)</option>
                    <option value="6">6 Meses (180 días)</option>
                    <option value="12">12 Meses (1 Año)</option>
                </select>
            </div>

            <button onclick="generar()" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-bolt"></i> Generar Clave
            </button>
        </div>

        <div id="resultado" class="hidden space-y-2 pt-4 border-t border-slate-700/60">
            <p class="text-xs font-semibold text-slate-400">Clave lista para enviar por WhatsApp:</p>
            <div id="keyBox" class="p-4 bg-slate-950 text-emerald-400 font-mono text-center font-bold text-lg rounded-xl border border-emerald-500/30 select-all tracking-wider"></div>
            <button onclick="copyKey()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 rounded-lg font-semibold transition-all flex items-center justify-center gap-1.5">
                <i class="fa-regular fa-copy"></i> Copiar Clave
            </button>
        </div>
    </div>

    <script>
        function generar() {
            const rawId = document.getElementById('devId').value.trim().toUpperCase();
            const meses = parseInt(document.getElementById('months').value);
            
            if (!rawId) return alert("Por favor ingresá el ID que te envió la clienta.");

            const cleanId = rawId.replace('ELLE-', '');
            const numId = parseInt(cleanId);

            if (isNaN(numId)) return alert("El ID debe contener un formato válido.");

            const hash = (numId * 7 + meses * 13).toString(16).toUpperCase();
            const claveFinal = cleanId + "-" + meses + "M-" + hash;

            document.getElementById('keyBox').textContent = claveFinal;
            document.getElementById('resultado').classList.remove('hidden');
        }

        function copyKey() {
            const keyText = document.getElementById('keyBox').textContent;
            navigator.clipboard.writeText(keyText);
            alert("¡Clave copiada!");
        }
    </script>
</body>
</html>
