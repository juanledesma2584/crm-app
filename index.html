<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elle CRM Real Estate</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        roseGold: {
                            50: '#fff9f7',
                            100: '#fdeee9',
                            200: '#fbdcd3',
                            400: '#f2a690',
                            500: '#e57a5c',
                            600: '#d15a3a',
                        },
                        sand: '#faf8f5',
                        chicDark: '#1c1917',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-sand text-slate-800 min-h-screen flex flex-col items-center p-3 sm:p-6 pb-20">

    <!-- BARRA SUPERIOR DE LICENCIA -->
    <div id="license-bar" class="w-full max-w-2xl mb-4 px-4 py-3 bg-white/90 backdrop-blur-md rounded-2xl border border-roseGold-100 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2.5 text-xs font-semibold text-slate-700">
            <div id="status-indicator" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <span id="license-status-text">Cargando estado...</span>
        </div>
        <button onclick="openLicenseModal()" class="text-xs text-roseGold-600 font-bold hover:underline flex items-center gap-1.5 bg-roseGold-50 px-3 py-1.5 rounded-xl border border-roseGold-100">
            <i class="fa-solid fa-key"></i> Licencia
        </button>
    </div>

    <!-- ENCABEZADO -->
    <header class="w-full max-w-2xl mb-6 bg-white p-6 rounded-3xl border border-roseGold-100 shadow-xl shadow-roseGold-500/5 relative overflow-hidden">
        <div class="flex items-center justify-between mb-4">
            <div>
                <span class="text-[10px] font-bold tracking-widest uppercase text-roseGold-500">Exclusivo para Agentes</span>
                <h1 class="text-2xl font-extrabold text-chicDark">ELLE <span class="font-normal text-roseGold-500">Real Estate</span></h1>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-roseGold-400 to-roseGold-600 text-white flex items-center justify-center text-xl shadow-lg shadow-roseGold-500/30">
                <i class="fa-solid fa-gem"></i>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2 bg-sand p-1.5 rounded-2xl border border-roseGold-100">
            <button onclick="switchTab('form')" id="btn-tab-form" class="py-2.5 text-xs font-bold rounded-xl bg-white text-roseGold-600 shadow-sm transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Nueva Ficha
            </button>
            <button onclick="switchTab('list')" id="btn-tab-list" class="py-2.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-address-book"></i> Clientes (<span id="count-badge">0</span>)
            </button>
        </div>
    </header>

    <!-- FORMULARIO DE REGISTRO -->
    <main id="tab-form" class="w-full max-w-2xl bg-white p-6 sm:p-8 rounded-3xl border border-roseGold-100 shadow-xl shadow-roseGold-500/5 space-y-4">
        <div class="pb-3 border-b border-roseGold-100 flex justify-between items-center">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Datos de la Atención</h2>
            <span class="text-xs font-semibold text-roseGold-500 bg-roseGold-50 px-2.5 py-1 rounded-full">Nuevo Prospecto</span>
        </div>

        <form id="crm-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Nombre completo del cliente *</label>
                <input type="text" id="nombreCliente" required placeholder="Ej. Sofia Rossi" class="w-full px-4 py-3 bg-sand text-slate-800 text-sm rounded-2xl border border-roseGold-100 focus:bg-white focus:border-roseGold-400 outline-none transition-all">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">WhatsApp / Teléfono *</label>
                    <input type="tel" id="telefono" required placeholder="Ej. 0981123456" class="w-full px-4 py-3 bg-sand text-slate-800 text-sm rounded-2xl border border-roseGold-100 focus:bg-white focus:border-roseGold-400 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Origen del Lead</label>
                    <select id="origenLead" class="w-full px-4 py-3 bg-sand text-slate-800 text-sm rounded-2xl border border-roseGold-100 focus:bg-white focus:border-roseGold-400 outline-none transition-all">
                        <option value="Instagram">Instagram</option>
                        <option value="Facebook">Facebook</option>
                        <option value="Recomendación">Recomendación</option>
                        <option value="Portal Inmobiliario">Portal Inmobiliario</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Tipo de Inmueble</label>
                    <select id="tipoInmueble" class="w-full px-4 py-3 bg-sand text-slate-800 text-sm rounded-2xl border border-roseGold-100 focus:bg-white focus:border-roseGold-400 outline-none transition-all">
                        <option value="Departamento">Departamento</option>
                        <option value="Casa">Casa</option>
                        <option value="Dúplex">Dúplex</option>
                        <option value="Penthouse">Penthouse</option>
                        <option value="Terreno">Terreno</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Presupuesto (USD)</label>
                    <input type="number" id="presupuesto" placeholder="Ej. 120000" class="w-full px-4 py-3 bg-sand text-slate-800 text-sm rounded-2xl border border-roseGold-100 focus:bg-white focus:border-roseGold-400 outline-none transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Propiedad Mostrada / Interés</label>
                <input type="text" id="propiedadMostrada" placeholder="Ej. Edificio Park Plaza Apt 502" class="w-full px-4 py-3 bg-sand text-slate-800 text-sm rounded-2xl border border-roseGold-100 focus:bg-white focus:border-roseGold-400 outline-none transition-all">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Estado</label>
                    <select id="estado" class="w-full px-4 py-3 bg-sand text-slate-800 text-sm rounded-2xl border border-roseGold-100 focus:bg-white focus:border-roseGold-400 outline-none transition-all">
                        <option value="Primer Contacto">Primer Contacto</option>
                        <option value="Visita Programada">Visita Programada</option>
                        <option value="En Negociación">En Negociación</option>
                        <option value="Cierre Ganado">Cierre Ganado ✨</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Fecha y Hora de Visita</label>
                    <input type="datetime-local" id="fechaVisita" class="w-full px-4 py-3 bg-sand text-slate-800 text-sm rounded-2xl border border-roseGold-100 focus:bg-white focus:border-roseGold-400 outline-none transition-all">
                </div>
            </div>

            <button type="submit" id="btn-save" class="w-full py-4 bg-gradient-to-r from-roseGold-500 to-roseGold-600 hover:from-roseGold-600 hover:to-roseGold-700 text-white font-bold text-sm rounded-2xl shadow-lg shadow-roseGold-500/30 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-sparkles"></i> Registrar Cliente
            </button>
        </form>
    </main>

    <!-- LISTA DE CLIENTES REGISTRADOS -->
    <section id="tab-list" class="w-full max-w-2xl bg-white p-6 sm:p-8 rounded-3xl border border-roseGold-100 shadow-xl shadow-roseGold-500/5 hidden space-y-4">
        <div class="pb-3 border-b border-roseGold-100 flex justify-between items-center">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Cartera Activa</h2>
            <button onclick="exportToCSV()" class="text-xs font-bold text-roseGold-600 bg-roseGold-50 px-3 py-1.5 rounded-xl border border-roseGold-100">
                <i class="fa-solid fa-download mr-1"></i> Excel
            </button>
        </div>
        <div id="clientes-container" class="space-y-3"></div>
    </section>

    <!-- MODAL DE ACTIVACIÓN -->
    <div id="license-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white max-w-sm w-full p-6 rounded-3xl border border-roseGold-100 shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 bg-roseGold-50 text-roseGold-500 rounded-2xl flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800">Activar Licencia CRM</h3>
            <p class="text-xs text-slate-500">Tu ID de Dispositivo único es:</p>
            
            <div class="bg-roseGold-50 p-2.5 rounded-xl border border-roseGold-200 font-mono text-sm font-bold text-roseGold-600 select-all" id="device-id-display">
                CARGANDO...
            </div>

            <p class="text-[11px] text-slate-400">Envía este ID para obtener tu clave de activación.</p>

            <input type="text" id="license-key-input" placeholder="Ingresar clave recibida" class="w-full px-4 py-3 bg-sand text-slate-800 text-sm rounded-2xl border border-roseGold-100 text-center uppercase font-mono outline-none">
            
            <div class="flex gap-2">
                <button onclick="closeLicenseModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold">Cerrar</button>
                <button onclick="applyLicenseKey()" class="flex-1 py-3 bg-roseGold-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-roseGold-500/20">Activar</button>
            </div>
        </div>
    </div>

    <!-- NOTIFICACIÓN TOAST -->
    <div id="toast" class="fixed bottom-5 right-5 bg-chicDark text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 text-xs font-semibold translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
        <i class="fa-solid fa-circle-check text-roseGold-400 text-base"></i>
        <span id="toast-msg">Mensaje</span>
    </div>

    <script>
        // --- MOTOR DE GENERACIÓN DE ID Y VERIFICACIÓN ---
        function getDeviceId() {
            let id = localStorage.getItem('crm_device_id');
            if (!id) {
                id = 'ELLE-' + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem('crm_device_id', id);
            }
            return id;
        }

        // Algoritmo de verificación matemática
        function verifyKey(deviceId, key) {
            const parts = key.split('-');
            if (parts.length !== 3) return 0;

            const [keyId, monthsStr, hash] = parts;
            if (keyId !== deviceId.replace('ELLE-', '')) return 0;

            const months = parseInt(monthsStr.replace('M', ''));
            const expectedHash = (parseInt(keyId) * 7 + months * 13).toString(16).toUpperCase();

            return (hash === expectedHash) ? months : 0;
        }

        function checkLicenseStatus() {
            const deviceId = getDeviceId();
            document.getElementById('device-id-display').textContent = deviceId;

            let trialStart = localStorage.getItem('crm_trial_start');
            let licenseExpiry = localStorage.getItem('crm_license_expiry');
            const now = new Date().getTime();

            if (!trialStart && !licenseExpiry) {
                trialStart = now;
                localStorage.setItem('crm_trial_start', trialStart);
            }

            let validUntil = licenseExpiry ? parseInt(licenseExpiry) : (parseInt(trialStart) + (30 * 24 * 60 * 60 * 1000));
            let daysLeft = Math.ceil((validUntil - now) / (1000 * 60 * 60 * 24));

            const statusText = document.getElementById('license-status-text');
            const statusIndicator = document.getElementById('status-indicator');
            const btnSave = document.getElementById('btn-save');

            if (daysLeft > 0) {
                statusText.innerHTML = licenseExpiry 
                    ? `Suscripción Activa (${daysLeft} días)`
                    : `Prueba Gratuita (${daysLeft} días restantes)`;
                statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                btnSave.disabled = false;
                btnSave.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                statusText.innerHTML = `<span class="text-rose-500">Licencia Vencida</span>`;
                statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                btnSave.disabled = true;
                btnSave.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function openLicenseModal() { document.getElementById('license-modal').classList.remove('hidden'); }
        function closeLicenseModal() { document.getElementById('license-modal').classList.add('hidden'); }

        function applyLicenseKey() {
            const deviceId = getDeviceId();
            const input = document.getElementById('license-key-input').value.trim().toUpperCase();
            
            const monthsAdded = verifyKey(deviceId, input);

            if (monthsAdded > 0) {
                const now = new Date().getTime();
                const currentExpiry = localStorage.getItem('crm_license_expiry');
                let baseDate = (currentExpiry && parseInt(currentExpiry) > now) ? parseInt(currentExpiry) : now;
                
                const daysToAdd = monthsAdded * 30;
                localStorage.setItem('crm_license_expiry', baseDate + (daysToAdd * 24 * 60 * 60 * 1000));
                
                closeLicenseModal();
                checkLicenseStatus();
                showToast(`¡Licencia de ${monthsAdded} mes(es) activada!`);
            } else {
                alert("La clave ingresada no es válida para este dispositivo.");
            }
        }

        // --- MANEJO DE CLIENTES ---
        const STORAGE_KEY = 'crm_elle_clientes';
        function getClientes() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }

        function handleFormSubmit(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombreCliente').value;
            const telefono = document.getElementById('telefono').value;
            const propiedad = document.getElementById('propiedadMostrada').value;
            const fecha = document.getElementById('fechaVisita').value;

            const cliente = {
                id: Date.now(),
                nombreCliente: nombre,
                telefono: telefono,
                origenLead: document.getElementById('origenLead').value,
                tipoInmueble: document.getElementById('tipoInmueble').value,
                presupuesto: document.getElementById('presupuesto').value,
                propiedadMostrada: propiedad,
                estado: document.getElementById('estado').value,
                fechaVisita: fecha,
            };

            const lista = getClientes();
            lista.unshift(cliente);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));

            if (fecha) {
                addToGoogleCalendar(nombre, propiedad, fecha);
            }

            document.getElementById('crm-form').reset();
            updateBadge();
            showToast("Cliente registrado ✨");
        }

        function openWhatsApp(telefono, nombre, propiedad) {
            const cleanPhone = telefono.replace(/\D/g, '');
            const mensaje = encodeURIComponent(`Hola ${nombre}, te escribo respecto al inmueble ${propiedad || 'tu consulta'}.`);
            window.open(`https://wa.me/${cleanPhone}?text=${mensaje}`, '_blank');
        }

        function addToGoogleCalendar(nombre, propiedad, fechaVisita) {
            if (!fechaVisita) return;
            const start = new Date(fechaVisita);
            const end = new Date(start.getTime() + 60 * 60 * 1000);
            const formatGCal = (date) => date.toISOString().replace(/-|:|\.\d\d\d/g, '');

            const title = encodeURIComponent(`Visita Inmobiliaria: ${nombre}`);
            const details = encodeURIComponent(`Cliente: ${nombre}\nPropiedad: ${propiedad || 'No especificada'}`);
            const dates = `${formatGCal(start)}/${formatGCal(end)}`;

            const gcalUrl = `https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}`;
            window.open(gcalUrl, '_blank');
        }

        function renderClientes() {
            const container = document.getElementById('clientes-container');
            const lista = getClientes();
            if (lista.length === 0) {
                container.innerHTML = `<p class="text-center py-8 text-xs text-slate-400">Sin clientes en la cartera.</p>`;
                return;
            }
            container.innerHTML = lista.map(c => `
                <div class="p-4 bg-sand rounded-2xl border border-roseGold-100 space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] font-bold text-roseGold-500 uppercase tracking-wider">${c.tipoInmueble}</span>
                            <h4 class="text-sm font-bold text-slate-800">${c.nombreCliente}</h4>
                        </div>
                        <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-white border border-roseGold-100 text-roseGold-600">${c.estado}</span>
                    </div>

                    <div class="text-xs text-slate-500 space-y-1">
                        <div><i class="fa-solid fa-building text-roseGold-400 mr-1.5"></i> Interés: ${c.propiedadMostrada || 'General'}</div>
                        ${c.fechaVisita ? `<div class="text-roseGold-600 font-semibold"><i class="fa-regular fa-calendar-check mr-1.5"></i> Visita: ${new Date(c.fechaVisita).toLocaleString()}</div>` : ''}
                    </div>

                    <div class="flex items-center gap-2 pt-2 border-t border-roseGold-100/60">
                        <button onclick="openWhatsApp('${c.telefono}', '${c.nombreCliente}', '${c.propiedadMostrada}')" class="flex-1 py-2 bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
                            <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                        </button>
                        ${c.fechaVisita ? `
                            <button onclick="addToGoogleCalendar('${c.nombreCliente}', '${c.propiedadMostrada}', '${c.fechaVisita}')" class="px-3 py-2 bg-white text-slate-700 rounded-xl text-xs font-bold border border-roseGold-100 flex items-center gap-1">
                                <i class="fa-regular fa-calendar-plus text-roseGold-500"></i> Agendar
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            document.getElementById('tab-form').classList.toggle('hidden', tab !== 'form');
            document.getElementById('tab-list').classList.toggle('hidden', tab !== 'list');
            if (tab === 'list') renderClientes();
        }

        function updateBadge() { document.getElementById('count-badge').textContent = getClientes().length; }
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);
        }

        checkLicenseStatus();
        updateBadge();
    </script>
</body>
</html>
